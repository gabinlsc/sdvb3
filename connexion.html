<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f5f4ee">
	<title>Connexion | Atelier Nord</title>
	<style>
		:root {
			color-scheme: light;
			font-family: "Trebuchet MS", "Segoe UI", sans-serif;
			color: #202925;
			background: #f5f4ee;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			grid-template-columns: minmax(260px, 0.9fr) minmax(360px, 1.1fr);
			background: #f5f4ee;
		}

		.visual {
			position: relative;
			display: flex;
			min-height: 100vh;
			flex-direction: column;
			justify-content: space-between;
			overflow: hidden;
			padding: clamp(28px, 5vw, 68px);
			color: #f7f5eb;
			background: #24473b;
		}

		.visual::before,
		.visual::after {
			position: absolute;
			content: "";
			pointer-events: none;
		}

		.visual::before {
			inset: 0;
			opacity: 0.2;
			background-image: repeating-linear-gradient(135deg, transparent 0 34px, #d2d9c5 35px, transparent 36px 70px);
			mask-image: linear-gradient(145deg, #000, transparent 72%);
		}

		.visual::after {
			right: -12vw;
			bottom: -23vw;
			width: min(62vw, 660px);
			aspect-ratio: 1;
			border: 1px solid rgb(247 245 235 / 28%);
			border-radius: 50%;
			box-shadow: 0 0 0 34px rgb(247 245 235 / 5%), 0 0 0 68px rgb(247 245 235 / 5%), 0 0 0 102px rgb(247 245 235 / 5%);
		}

		.brand,
		.visual-copy,
		.visual-footer {
			position: relative;
			z-index: 1;
		}

		.brand {
			display: inline-flex;
			align-items: center;
			gap: 12px;
			color: inherit;
			font-size: 15px;
			font-weight: 700;
			letter-spacing: 0.08em;
			text-decoration: none;
			text-transform: uppercase;
		}

		.brand-mark {
			display: grid;
			width: 34px;
			aspect-ratio: 1;
			place-items: center;
			border: 1px solid rgb(247 245 235 / 55%);
			border-radius: 50%;
			font-family: Georgia, serif;
			font-size: 20px;
			font-weight: 400;
		}

		.visual-copy {
			max-width: 480px;
			margin: auto 0;
			padding: 70px 0;
			animation: rise-in 650ms ease-out both;
		}

		.eyebrow {
			margin: 0 0 20px;
			color: #d2d9c5;
			font-size: 12px;
			font-weight: 700;
			letter-spacing: 0.16em;
			text-transform: uppercase;
		}

		.visual h1 {
			max-width: 440px;
			margin: 0;
			font-family: Georgia, "Times New Roman", serif;
			font-size: clamp(42px, 5.5vw, 76px);
			font-weight: 400;
			line-height: 1.02;
		}

		.visual-copy p:last-child {
			max-width: 340px;
			margin: 24px 0 0;
			color: #d9ded4;
			font-size: 16px;
			line-height: 1.65;
		}

		.visual-footer {
			color: #d9ded4;
			font-size: 12px;
		}

		.form-side {
			display: grid;
			min-height: 100vh;
			place-items: center;
			padding: 48px 28px;
		}

		.login {
			width: min(100%, 420px);
			animation: rise-in 650ms 100ms ease-out both;
		}

		.form-eyebrow {
			margin: 0 0 12px;
			color: #68736b;
			font-size: 12px;
			font-weight: 700;
			letter-spacing: 0.14em;
			text-transform: uppercase;
		}

		.login h2 {
			margin: 0;
			font-family: Georgia, "Times New Roman", serif;
			font-size: clamp(34px, 4vw, 46px);
			font-weight: 400;
			line-height: 1.1;
		}

		.intro {
			margin: 14px 0 34px;
			color: #68736b;
			font-size: 15px;
			line-height: 1.6;
		}

		form {
			display: grid;
			gap: 22px;
		}

		.field {
			display: grid;
			gap: 8px;
		}

		label {
			font-size: 14px;
			font-weight: 700;
		}

		input {
			width: 100%;
			min-height: 52px;
			padding: 0 15px;
			border: 1px solid #c9cec5;
			border-radius: 3px;
			outline: none;
			background: #fffefa;
			color: #202925;
			font: inherit;
			transition: border-color 160ms ease, box-shadow 160ms ease;
		}

		input::placeholder {
			color: #929a91;
		}

		input:focus-visible {
			border-color: #315b4a;
			box-shadow: 0 0 0 3px rgb(49 91 74 / 16%);
		}

		button {
			min-height: 54px;
			margin-top: 4px;
			border: 0;
			border-radius: 3px;
			background: #24473b;
			color: #fffefa;
			cursor: pointer;
			font: inherit;
			font-size: 15px;
			font-weight: 700;
			transition: background-color 160ms ease, transform 160ms ease;
		}

		button:hover {
			background: #315b4a;
		}

		button:active {
			transform: translateY(1px);
		}

		button:focus-visible {
			outline: 3px solid #78977f;
			outline-offset: 3px;
		}

		@keyframes rise-in {
			from {
				opacity: 0;
				transform: translateY(12px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		@media (max-width: 760px) {
			body {
				grid-template-columns: 1fr;
			}

			.visual {
				min-height: 250px;
				padding: 24px;
			}

			.visual-copy {
				padding: 42px 0 12px;
			}

			.visual h1 {
				max-width: 360px;
				font-size: clamp(38px, 9vw, 56px);
			}

			.visual-copy p:last-child,
			.visual-footer {
				display: none;
			}

			.visual::after {
				right: -22vw;
				bottom: -40vw;
				width: 72vw;
			}

			.form-side {
				min-height: auto;
				padding: 48px 24px 64px;
			}
		}

		@media (prefers-reduced-motion: reduce) {
			*,
			*::before,
			*::after {
				scroll-behavior: auto !important;
				animation-duration: 0.01ms !important;
				animation-iteration-count: 1 !important;
				transition-duration: 0.01ms !important;
			}
		}
	</style>
</head>
<body>
	<aside class="visual" aria-label="SDVB3">
		<a class="brand" href="connexion.html" aria-label="SDVB3, accueil">
			<span>SDVB3</span>
		</a>
		<div class="visual-copy">
			<p class="eyebrow">Espace collaborateurs</p>
			<h1>Le travail bien fait, ensemble.</h1>
			<p>Retrouvez votre espace de travail et les ressources de l'équipe.</p>
		</div>
		<div class="visual-footer">Un espace simple, pour avancer ensemble.</div>
	</aside>

	<main class="form-side">
		<section class="login" aria-labelledby="login-title">
			<p class="form-eyebrow">Bon retour parmi nous</p>
			<h2 id="login-title">Se connecter</h2>
			<p class="intro">Saisissez vos identifiants pour accéder à votre espace.</p>
			<form action="#" method="post">
				<div class="field">
					<label for="email">Adresse e-mail</label>
					<input id="email" name="email" type="email" placeholder="nom@exemple.fr" autocomplete="email" required>
				</div>
				<div class="field">
					<label for="password">Mot de passe</label>
					<input id="password" name="password" type="password" placeholder="Votre mot de passe" autocomplete="current-password" required>
				</div>
				<button type="submit">Se connecter</button>
			</form>
		</section>
	</main>
</body>
</html>
